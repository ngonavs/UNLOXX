 future starts in every classroom.',tabs:[['overview','Overview'],['students','Students'],['sessions','Sessions'],['personal','School profile']]}};let user,role,status,profile={};function node(tag,cl,text){const e=document.createElement(tag);if(cl)e.className=cl;if(text!==undefined)e.textContent=text;return e}function card(parent,title,body){const c=node('div','card');c.append(node('h3','',title),node('p','muted',body));parent.append(c);return c}function input(parent,label,value,max=5000){const w=node('label','field');w.append(node('span','',label));const field=document.createElement(label==='My Dreams'||label==='My notes'?'textarea':'input');field.maxLength=max;field.value=value||'';w.append(field);parent.append(w);return field}function note(parent,text){parent.append(node('p','muted',text))}function tab(id){document.querySelectorAll('#panels .panel').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id))}function formPanel(parent){const c=card(parent,'My real profile','This information belongs to your account, not the demo.');const name=input(c,'Display name',profile.display_name,60);const nick=input(c,'Nickname',profile.nickname,50);const dreams=role==='young'?input(c,'My Dreams',profile.dreams,5000):null;const notes=input(c,'My notes',profile.notes,5000);const save=node('button','','Save changes');const feedback=node('p','muted','');c.append(save,feedback);save.onclick=async()=>{save.disabled=true;feedback.textContent='Saving…';const n=name.value.trim();if(!n){feedback.textContent='Display name is required.';save.disabled=false;return}const requests=[client.from('profiles').update({display_name:n}).eq('id',user.id),client.from('user_preferences').upsert({user_id:user.id,nickname:nick.value.trim()||null},{onConflict:'user_id'}),client.from('portal_workspace').upsert({user_id:user.id,dreams:dreams?dreams.value:profile.dreams||'',notes:notes.value},{onConflict:'user_id'})];const results=await Promise.all(requests);feedback.textContent=results.some(x=>x.error)?'Some changes could not be saved: '+results.filter(x=>x.error).map(x=>x.error.message).join('; '):'Saved to your real UNLOXX account.';save.disabled=false}}function render(){const c=config[role];document.body.classList.add(role);$('portalTag').textContent='UNLOXX '+c.name+' · REAL ACCOUNT';$('heading').textContent='Welcome back, '+(profile.nickname||profile.display_name||c.name)+'! ✨';$('subheading').textContent=c.intro;$('approval').textContent=status==='approved'?'Your portal membership is approved.':'Your portal membership is '+status+'. Features requiring verification or approval remain unavailable.';const tabs=$('tabs'),panels=$('panels');tabs.replaceChildren();panels.replaceChildren();for(const [id,label] of c.tabs){const b=node('button','',label);b.dataset.tab=id;b.onclick=()=>tab(id);tabs.append(b);const panel=node('section','panel');panel.dataset.tab=id;panels.append(panel);if(id==='overview'){const grid=node('div','grid');panel.append(grid);if(role==='young'){card(grid,'🔎 Discover mentors','Mentor discovery will show verified real mentors once the directory is connected.');card(grid,'📅 Find events','Real approved events and registrations will appear here.');card(grid,'🌱 My Dreams','Your personal goals are saved in My Space.')}if(role==='mentor'){card(grid,'📚 Questions','Real moderated questions will appear here.');card(grid,'📅 Events','Event creation requires verified mentor approval.');card(grid,'🎨 My space','Save your nickname and personal notes.')}if(role==='school'){card(grid,'🏫 School activities','Verified school activities will appear here.');card(grid,'📅 Sessions','Real sessions require institution verification.');card(grid,'📊 Student progress','Student information is restricted to authorized staff.')}}else if(id==='personal'){formPanel(panel)}else if(id==='mentors'){card(panel,'Discover real mentors','No fictional mentor profiles are shown in real mode. The verified mentor directory is not connected yet.')}else if(id==='events'){card(panel,'Real events','Events and registration are not enabled yet. No demo event registrations are carried into your account.')}else if(id==='connect'){card(panel,'Student Connect','Real student-to-student messaging will require consent, moderation and safeguarding before activation.')}else if(id==='questions'){card(panel,'Mentor questions','Moderated questions are not connected yet.')}else if(id==='students'){card(panel,'Students','Real student records will appear only after school verification and access approval.')}else if(id==='sessions'){card(panel,'Sessions','School sessions are not yet connected to real data.')}}tab('overview');$('loading').classList.add('hide');$('app').classList.remove('hide')}async function start(){if(!client){$('loading').textContent='Authentication service unavailable.';return}const {data:{user:u},error}=await client.auth.getUser();if(error||!u){location.replace('./account.html');return}user=u;const {data:members,error:me}=await client.from('portal_memberships').select('portal,status').eq('user_id',u.id);if(me||members?.length!==1||!config[members[0].portal]){$('loading').textContent='Unable to verify one permanent registered portal. Please contact support.';return}role=members[0].portal;status=members[0].status;const [p,n,w]=await Promise.all([client.from('profiles').select('display_name').eq('id',u.id).maybeSingle(),client.from('user_preferences').select('nickname').eq('user_id',u.id).maybeSingle(),client.from('portal_workspace').select('dreams,notes').eq('user_id',u.id).maybeSingle()]);if(p.error||n.error||w.error){$('loading').textContent='Unable to load your private workspace. Please try again.';return}profile={display_name:p.data?.display_name||u.email?.split('@')[0]||'Member',nickname:n.data?.nickname||'',dreams:w.data?.dreams||'',notes:w.data?.notes||''};render()}$('logout').onclick=async()=>{const {error}=await client.auth.signOut();if(error)alert(error.message);else location.replace('./index.html#home')};start()})();</script></body></html>
